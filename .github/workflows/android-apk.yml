name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.0.12077973" "platform-tools"
          ls "$ANDROID_HOME/platforms"
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add aarch64-linux-android --toolchain 1.90.0
      - name: UI dependencies
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Build debug APK
        run: |
          python --version
          python build-android.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --build-python "$(command -v python)" --debug
      - name: Build release APK (self-signed)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openwrt-tools.p12"
          OPENWRT_ANDROID_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          OPENWRT_ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          python build-android.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --build-python "$(command -v python)" --keystore "$RUNNER_TEMP/openwrt-tools.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-tools-apk
          path: |
            artifacts/android/*.apk
            artifacts/android/*.json
